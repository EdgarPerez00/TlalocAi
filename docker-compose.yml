services:
  tlalocai-identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/TlalocAi.Identity.Api/Dockerfile
    environment: &api-env
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-server=host.docker.internal;port=3306;database=tlalocai_databse;user=tlalocai;password=TlalocaiApp123!}
      Jwt__Issuer: ${Jwt__Issuer:-TlalocAi}
      Jwt__Audience: ${Jwt__Audience:-TlalocAi.Frontend}
      Jwt__SigningKey: ${Jwt__SigningKey:-change-this-development-signing-key-minimum-32-chars}
      DeviceAuth__ApiKeyHeaderName: ${DeviceAuth__ApiKeyHeaderName:-X-Device-Api-Key}
      Cors__AllowPrivateNetworkOrigins: ${Cors__AllowPrivateNetworkOrigins:-true}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1:-http://localhost:3000}
      Cors__AllowedOrigins__2: ${Cors__AllowedOrigins__2:-http://localhost:5174}
      Cors__AllowedOrigins__3: ${Cors__AllowedOrigins__3:-http://localhost:5175}
    ports:
      - "5101:8080"
    networks:
      - tlalocai-network

  tlalocai-devices-api:
    build:
      context: .
      dockerfile: src/Services/Devices/TlalocAi.Devices.Api/Dockerfile
    environment: *api-env
    ports:
      - "5102:8080"
    networks:
      - tlalocai-network

  tlalocai-telemetry-api:
    build:
      context: .
      dockerfile: src/Services/Telemetry/TlalocAi.Telemetry.Api/Dockerfile
    environment: *api-env
    ports:
      - "5103:8080"
    networks:
      - tlalocai-network

  tlalocai-control-api:
    build:
      context: .
      dockerfile: src/Services/Control/TlalocAi.Control.Api/Dockerfile
    environment: *api-env
    ports:
      - "5104:8080"
    networks:
      - tlalocai-network

  tlalocai-analytics-api:
    build:
      context: .
      dockerfile: src/Services/Analytics/TlalocAi.Analytics.Api/Dockerfile
    environment: *api-env
    ports:
      - "5105:8080"
    networks:
      - tlalocai-network

  tlalocai-gateway-api:
    build:
      context: .
      dockerfile: src/Services/Gateway/TlalocAi.Gateway.Api/Dockerfile
    environment:
      <<: *api-env
      Services__Identity: http://tlalocai-identity-api:8080
      Services__Devices: http://tlalocai-devices-api:8080
      Services__Telemetry: http://tlalocai-telemetry-api:8080
      Services__Control: http://tlalocai-control-api:8080
      Services__Analytics: http://tlalocai-analytics-api:8080
    ports:
      - "5100:8080"
    depends_on:
      - tlalocai-identity-api
      - tlalocai-devices-api
      - tlalocai-telemetry-api
      - tlalocai-control-api
      - tlalocai-analytics-api
    networks:
      - tlalocai-network

  tlalocai-web:
    build:
      context: ./src/Web/TlalocAi.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5100
        VITE_IDENTITY_API_BASE_URL: http://localhost:5101
        VITE_DEVICES_API_BASE_URL: http://localhost:5102
        VITE_TELEMETRY_API_BASE_URL: http://localhost:5103
        VITE_CONTROL_API_BASE_URL: http://localhost:5104
        VITE_ANALYTICS_API_BASE_URL: http://localhost:5105
        VITE_USE_GATEWAY: "true"
    container_name: tlalocai-web
    ports:
      - "5174:80"
    environment:
      VITE_API_BASE_URL: http://localhost:5100
      VITE_USE_GATEWAY: "true"
    depends_on:
      - tlalocai-gateway-api
    networks:
      - tlalocai-network

networks:
  tlalocai-network:
    name: tlalocai-network
