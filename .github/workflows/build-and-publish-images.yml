name: Build and Publish Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: src/Services/Analytics/TlalocAi.Analytics.Api/Dockerfile
            image_name: tlalocaianalyticsapi
          - dockerfile: src/Services/Control/TlalocAi.Control.Api/Dockerfile
            image_name: tlalocaicontrolapi
          - dockerfile: src/Services/Devices/TlalocAi.Devices.Api/Dockerfile
            image_name: tlalocaidevicesapi
          - dockerfile: src/Services/Gateway/TlalocAi.Gateway.Api/Dockerfile
            image_name: tlalocaigatewayapi
          - dockerfile: src/Services/Identity/TlalocAi.Identity.Api/Dockerfile
            image_name: tlalocaiidentityapi
          - dockerfile: src/Services/Telemetry/TlalocAi.Telemetry.Api/Dockerfile
            image_name: tlalocaitelemetryapi
          - dockerfile: src/Web/TlalocAi.Web/Dockerfile
            image_name: tlalocaiweb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize GHCR owner
        id: ghcr
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ steps.ghcr.outputs.owner }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
